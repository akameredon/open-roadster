<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>OPEN ROADSTER — Email confirmation</title>
<style>
  :root { --bg:#0b0d10; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2f36; --accent:#4da3ff; }
  /* If your site's main stylesheet defines these variables, link it above and delete this :root block. */
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:1.5rem; }
  main { max-width:460px; text-align:center; }
  h1 { font-size:1.4rem; letter-spacing:.08em; }
  button, a.btn { display:inline-block; margin-top:1rem; padding:.9rem 1.4rem; font-size:1rem; font-weight:600;
    border:0; border-radius:8px; background:var(--accent); color:#04121f; text-decoration:none; cursor:pointer; }
  [hidden] { display:none !important; }
  button[disabled] { opacity:.6; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  p { color:var(--muted); line-height:1.5; } #msg { color:var(--text); }
</style>
</head>
<body>
<main>
  <h1>OPEN ROADSTER</h1>
  <p id="msg" role="status" aria-live="polite">Loading…</p>
  <button id="go" hidden></button>
  <p><a href="./">Back to the project</a></p>
</main>
<script>
(function () {
  // >>> same URL as in the signup form <<<
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxhb7jBxkHdn95s-bYylQ_7GYfXGlXouWlElG69CHGocHJSGCtJnqvvFXfy033v7uej/exec';

  var q = new URLSearchParams(location.search);
  var a = q.get('a'), t = q.get('t');
  var msg = document.getElementById('msg'), go = document.getElementById('go');

  if ((a !== 'verify' && a !== 'unsub') || !t) { msg.textContent = 'This link is incomplete. Please use the link from your email.'; return; }
  history.replaceState(null, '', location.pathname);        // remove token from address bar/history

  // A button click (not auto-run on load) stops email link-scanners from consuming the token.
  var verifying = a === 'verify';
  msg.textContent = verifying ? 'Click below to confirm your email address.' : 'Click below to unsubscribe from OPEN ROADSTER updates.';
  go.textContent = verifying ? 'Confirm my email' : 'Unsubscribe';
  go.hidden = false;

  go.addEventListener('click', function () {
    go.disabled = true; msg.textContent = 'Working…';
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: verifying ? 'verify' : 'unsubscribe', token: t })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) { msg.textContent = (d && d.message) || 'Something went wrong.'; go.hidden = true; })
    .catch(function () { msg.textContent = 'Could not reach the service. Please try again.'; go.disabled = false; });
  });
})();
</script>
</body>
</html>
